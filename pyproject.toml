[project]
name = "spikyeggroll"
version = "0.1.0"
description = "Spiking neural networks in JAX with the EGGROLL algorithm"
requires-python = ">=3.11"
dependencies = [
    "optax>=0.1.7",
    "torch>=2.2",
    "torchvision>=0.17",
    "tonic",
    "h5py",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
tracking = [
    "wandb",
]
cpu = [
    "jax>=0.4.20",
]
cuda12 = [
    "jax[cuda12]>=0.4.20",
]
cuda13 = [
    "jax[cuda13]>=0.4.20",
]

[tool.setuptools.packages.find]
include = ["spikyeggroll*", "hyperscalees*"]

[tool.setuptools.package-data]
hyperscalees = ["tok_files/*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
